<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Home Lab Architecture — Yonatan Valencia 2026</title>
  <desc>Self-hosted infrastructure with Cloudflare Tunnel, Docker, Kamal, Portainer and Netdata, alongside statically hosted sites on GitHub Pages</desc>

  <defs>
    <style>
      .bg        { fill: #0d1117; }
      .card      { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 10; }
      .card-cf   { fill: #1a1f2e; stroke: #F38020; stroke-width: 1.5; }
      .card-dock { fill: #0f1929; stroke: #2496ED; stroke-width: 1.5; }
      .card-app  { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .card-net  { fill: #0f1a14; stroke: #00AB44; stroke-width: 1; }
      .card-gh   { fill: #14101f; stroke: #a371f7; stroke-width: 1.5; }
      .card-kamal{ fill: #170b0b; stroke: #CC0000; stroke-width: 1.3; }

      .label-main { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .label-sub  { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 400; fill: #8b949e; }
      .label-cf   { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #F38020; }
      .label-dock { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #2496ED; }
      .label-app  { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #c9d1d9; }
      .label-net  { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #00AB44; }
      .label-gh   { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #a371f7; }
      .label-kamal{ font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; fill: #ff6b6b; }
      .label-url  { font-family: 'JetBrains Mono', monospace; font-size: 9px;  font-weight: 400; fill: #58a6ff; }
      .label-port { font-family: 'JetBrains Mono', monospace; font-size: 9px;  font-weight: 400; fill: #8b949e; }

      .arrow-cf   { stroke: #F38020; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
      .arrow-dock { stroke: #2496ED; stroke-width: 1.5; fill: none; }
      .arrow-app  { stroke: #30363d; stroke-width: 1;   fill: none; }
      .arrow-net  { stroke: #00AB44; stroke-width: 1;   fill: none; stroke-dasharray: 3 3; }
      .arrow-gh   { stroke: #a371f7; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }

      .dot-cf   { fill: #F38020; }
      .dot-dock { fill: #2496ED; }
      .dot-net  { fill: #00AB44; }
      .dot-gh   { fill: #a371f7; }

      .section-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 400; fill: #484f58; text-transform: uppercase; letter-spacing: 0.1em; }

      .pulse-cf   { animation: pulse-cf 2s ease-in-out infinite; transform-origin: 70px 140px; }
      .pulse-dock { animation: pulse-dock 2.4s ease-in-out infinite 0.4s; transform-origin: 70px 250px; }
      .pulse-net  { animation: pulse-net 2.8s ease-in-out infinite 0.8s; transform-origin: 620px 330px; }
      .pulse-gh   { animation: pulse-gh 2.2s ease-in-out infinite 0.2s; transform-origin: 780px 46px; }

      @keyframes pulse-cf   { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.4); } }
      @keyframes pulse-dock { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.4); } }
      @keyframes pulse-net  { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.4); } }
      @keyframes pulse-gh   { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.4); } }

      .flow-cf   { stroke-dasharray: 5 3; animation: flow 1.6s linear infinite; }
      .flow-dock { animation: flow 1.2s linear infinite; }
      .flow-app  { animation: flow 1.8s linear infinite 0.3s; }
      .flow-gh   { stroke-dasharray: 5 3; animation: flow 1.6s linear infinite; }

      @keyframes flow { to { stroke-dashoffset: -16; } }

      .fade-1 { animation: fadein 0.6s ease both; }
      .fade-2 { animation: fadein 0.6s ease 0.15s both; }
      .fade-3 { animation: fadein 0.6s ease 0.3s  both; }
      .fade-4 { animation: fadein 0.6s ease 0.45s both; }
      .fade-5 { animation: fadein 0.6s ease 0.6s  both; }
      .fade-6 { animation: fadein 0.6s ease 0.75s both; }
      .fade-7 { animation: fadein 0.6s ease 0.9s  both; }
      .fade-8 { animation: fadein 0.6s ease 1.05s both; }

      @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <marker id="arr-cf"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F38020"/></marker>
    <marker id="arr-dock" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2496ED"/></marker>
    <marker id="arr-app"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#30363d"/></marker>
    <marker id="arr-net"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#00AB44"/></marker>
    <marker id="arr-gh"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a371f7"/></marker>
  </defs>

  <rect width="900" height="520" class="bg"/>

  <!-- ── INTERNET ─────────────────────────────── -->
  <g class="fade-1">
    <rect x="20" y="20" width="120" height="52" rx="8" class="card"/>
    <text x="80" y="42" text-anchor="middle" class="label-main">Internet</text>
    <text x="80" y="58" text-anchor="middle" class="label-sub">HTTPS</text>
  </g>

  <!-- arrow internet → cloudflare -->
  <line x1="140" y1="46" x2="194" y2="46" class="arrow-cf flow-cf" marker-end="url(#arr-cf)"/>
  <text x="167" y="40" text-anchor="middle" class="label-sub">TLS</text>

  <!-- arrow internet → github pages (top branch) -->
  <path d="M 80 20 L 80 8 L 780 8 L 780 20" fill="none" class="arrow-gh flow-gh" marker-end="url(#arr-gh)"/>

  <!-- ── CLOUDFLARE ─────────────────────────────── -->
  <g class="fade-2">
    <rect x="196" y="20" width="170" height="52" rx="8" class="card-cf"/>
    <text x="281" y="38" text-anchor="middle" class="label-cf">☁ Cloudflare</text>
    <text x="281" y="54" text-anchor="middle" class="label-sub">DNS · TLS · DDoS protect</text>
    <circle cx="358" cy="46" r="4" class="dot-cf pulse-cf"/>
  </g>

  <!-- arrow cloudflare → tunnel -->
  <line x1="366" y1="46" x2="420" y2="46" class="arrow-cf flow-cf" marker-end="url(#arr-cf)"/>
  <text x="393" y="40" text-anchor="middle" class="label-sub">tunnel</text>

  <!-- ── TUNNEL ──────────────────────────────── -->
  <g class="fade-3">
    <rect x="422" y="20" width="170" height="52" rx="8" class="card-cf"/>
    <text x="507" y="38" text-anchor="middle" class="label-cf">cloudflared</text>
    <text x="507" y="54" text-anchor="middle" class="label-sub">homelab-tunnel · no open ports</text>
  </g>

  <!-- arrow tunnel → docker -->
  <line x1="507" y1="72" x2="507" y2="112" class="arrow-dock flow-dock" marker-end="url(#arr-dock)"/>

  <!-- ── GITHUB PAGES (static branch, no homelab) ── -->
  <g class="fade-2">
    <rect x="700" y="20" width="180" height="52" rx="8" class="card-gh"/>
    <text x="790" y="38" text-anchor="middle" class="label-gh">▲ GitHub Pages</text>
    <text x="790" y="54" text-anchor="middle" class="label-sub">static hosting · no server</text>
    <circle cx="872" cy="46" r="4" class="dot-gh pulse-gh"/>
  </g>
  <line x1="790" y1="72" x2="790" y2="112" class="arrow-gh flow-gh" marker-end="url(#arr-gh)"/>
  <g class="fade-3">
    <rect x="700" y="114" width="180" height="66" rx="8" class="card-app"/>
    <text x="790" y="134" text-anchor="middle" class="label-app">Resplandor · Landing</text>
    <text x="790" y="150" text-anchor="middle" class="label-url">yvalenta.github.io/resplandor</text>
    <text x="790" y="164" text-anchor="middle" class="label-port">HTML · Tailwind · Alpine.js</text>
  </g>
  <text x="790" y="196" text-anchor="middle" class="label-sub" opacity="0.6">independiente del homelab</text>

  <!-- ── DOCKER ENGINE ───────────────────────── -->
  <g class="fade-4">
    <rect x="140" y="114" width="540" height="316" rx="12" class="card-dock"/>
    <text x="410" y="136" text-anchor="middle" class="label-dock">🐳 Docker Engine</text>
    <text x="410" y="150" text-anchor="middle" class="label-sub">Ubuntu Server · home lab · 192.168.40.253</text>
  </g>

  <!-- ── Portainer ──────────────────────────── -->
  <g class="fade-5">
    <rect x="160" y="162" width="160" height="52" rx="8" class="card-app"/>
    <text x="240" y="182" text-anchor="middle" class="label-app">Portainer</text>
    <text x="240" y="198" text-anchor="middle" class="label-url">portainer.ynt.codes</text>
  </g>

  <!-- ── cv_app ──────────────────────────────── -->
  <g class="fade-5">
    <rect x="336" y="162" width="150" height="52" rx="8" class="card-app"/>
    <text x="411" y="182" text-anchor="middle" class="label-app">cv_app</text>
    <text x="411" y="198" text-anchor="middle" class="label-url">cv.ynt.codes</text>
  </g>

  <!-- ── loan_calculator ────────────────────── -->
  <g class="fade-5">
    <rect x="502" y="162" width="160" height="52" rx="8" class="card-app"/>
    <text x="582" y="182" text-anchor="middle" class="label-app">loan_calculator</text>
    <text x="582" y="198" text-anchor="middle" class="label-url">loan_calculator.ynt.codes</text>
  </g>

  <!-- tunnel branches down to each app row -->
  <line x1="240" y1="214" x2="240" y2="240" class="arrow-app flow-app" marker-end="url(#arr-app)"/>
  <line x1="411" y1="214" x2="411" y2="240" class="arrow-app flow-app" marker-end="url(#arr-app)"/>
  <line x1="582" y1="214" x2="582" y2="240" class="arrow-app flow-app" marker-end="url(#arr-app)"/>

  <!-- ── ADVANCE FITNESS APP (Kamal-deployed, flagship) ── -->
  <g class="fade-6">
    <rect x="160" y="242" width="330" height="100" rx="10" class="card-kamal"/>
    <text x="325" y="264" text-anchor="middle" class="label-kamal">🚀 advance-fitness-app · Kamal 2</text>
    <text x="325" y="280" text-anchor="middle" class="label-url">advance-fitness-app.ynt.codes</text>
    <text x="325" y="296" text-anchor="middle" class="label-sub">Rails 8.1 · Ruby 4.0.5 · Thruster + Puma 8</text>
    <text x="325" y="311" text-anchor="middle" class="label-sub">network-alias: rails-app · docker-lab_proxy-network</text>
    <text x="325" y="326" text-anchor="middle" class="label-sub">→ Supabase (PostgreSQL 17, AWS pooler, externo)</text>
  </g>

  <!-- ── Docker volume storage ── -->
  <g class="fade-6">
    <rect x="502" y="242" width="160" height="100" rx="8" class="card-app"/>
    <text x="582" y="264" text-anchor="middle" class="label-app">Docker Volume</text>
    <text x="582" y="280" text-anchor="middle" class="label-sub">advance_fitness_app_storage</text>
    <text x="582" y="296" text-anchor="middle" class="label-sub">:/rails/storage</text>
    <text x="582" y="312" text-anchor="middle" class="label-sub">caché GIFs/imágenes</text>
    <text x="582" y="326" text-anchor="middle" class="label-sub">catálogo de ejercicios</text>
  </g>

  <!-- ── Netdata + Uptime Kuma ─────────────────── -->
  <g class="fade-7">
    <rect x="160" y="356" width="502" height="62" rx="8" class="card-net"/>
    <text x="180" y="378" class="label-net">📊 Netdata</text>
    <text x="180" y="394" class="label-sub">CPU · memoria · SSH · tráfico nginx · Docker stats</text>
    <line x1="420" y1="366" x2="420" y2="410" stroke="#1a2e1a" stroke-width="1"/>
    <text x="440" y="378" class="label-net">🟢 Uptime Kuma</text>
    <text x="440" y="394" class="label-sub">status page pública · :3001 · alertas</text>
    <circle cx="655" cy="378" r="4" class="dot-net pulse-net"/>
  </g>

  <!-- ── AI WORKFLOW STRIP ───────────────────── -->
  <g class="fade-8">
    <rect x="140" y="440" width="740" height="38" rx="8" fill="#0f1a2e" stroke="#1f3a5f" stroke-width="1"/>
    <text x="510" y="455" text-anchor="middle" class="label-sub">🤖  AI-assisted build &amp; deploy</text>
    <text x="510" y="469" text-anchor="middle" class="label-sub">Claude · Gemini · arquitectura · debugging · configs Kamal/Docker · docs</text>
  </g>

  <!-- Section labels -->
  <text x="20"  y="14"  class="section-label">public layer</text>
  <text x="140" y="110" class="section-label">private server — no open ports</text>
  <text x="700" y="110" class="section-label">no server involved</text>
</svg>
